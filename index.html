<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d14" />
    <meta name="description" content="SCHOOLFLOW — L'école, simplement. Une expérience scolaire moderne, claire et pensée pour les élèves et les enseignants. Projet indépendant de démonstration." />
    <meta name="application-name" content="SCHOOLFLOW" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SCHOOLFLOW" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#6366f1" />
    <title>SCHOOLFLOW — L'école, simplement.</title>
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('sf.theme') || 'auto'
          var dark =
            t === 'dark' ||
            (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var accent = localStorage.getItem('sf.accent')
          if (accent) document.documentElement.style.setProperty('--accent', accent)
          var noAnim = localStorage.getItem('sf.animations') === 'false'
          if (noAnim) document.documentElement.classList.add('reduce-animations')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>SCHOOLFLOW nécessite JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
